services:
  postgres:
    image: postgres:16-alpine
    container_name: shaadwood-postgres
    restart: always
    environment:
      POSTGRES_USER: shaadwood_user
      POSTGRES_PASSWORD: shaadwood_password
      POSTGRES_DB: shaadwood_db
    ports:
      - "5432:5432"
    volumes:
      - shaadwood_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shaadwood_user -d shaadwood_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: shaadwood-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@shaadwood.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  shaadwood_pgdata:
    driver: local
